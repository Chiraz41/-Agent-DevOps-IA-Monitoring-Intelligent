global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook'

  routes:
    - match:
        severity: critical
      receiver: 'webhook'
      group_wait: 5s
      repeat_interval: 5m

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://devops_ai_agent:8000/alerts/webhook'
        send_resolved: true