input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Exemple de parsing basique - à adapter selon le format réel des logs
  if [message] {
    mutate {
      add_field => { "source_type" => "app-log" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}