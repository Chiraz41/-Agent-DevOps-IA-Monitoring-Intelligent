networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  esdata:
  redis-data:

services:
  # ---------------------------------------------------------
  # NGINX - Serveur web cible à surveiller
  # ---------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "8081:80"
    networks:
      - monitoring-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # PROMETHEUS - Collecte des métriques système
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # NODE EXPORTER - Expose les métriques machine (CPU, RAM, disque)
  # ---------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # CADVISOR - DÉSACTIVÉ TEMPORAIREMENT (gcr.io injoignable)
  # ---------------------------------------------------------
  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:latest
  #   container_name: cadvisor
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:ro
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #   networks:
  #     - monitoring-net
  #   restart: unless-stopped

  # ---------------------------------------------------------
  # GRAFANA - Visualisation (dashboards)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------
  # ELASTICSEARCH - Stockage et indexation des logs
  # ---------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - monitoring-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # LOGSTASH - Collecte et traitement des logs
  # ---------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "9600:9600"
    networks:
      - monitoring-net
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ---------------------------------------------------------
  # KIBANA - Recherche et visualisation des logs
  # ---------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - monitoring-net
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ---------------------------------------------------------
  # REDIS - Cache / stockage temporaire
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - monitoring-net
    restart: unless-stopped