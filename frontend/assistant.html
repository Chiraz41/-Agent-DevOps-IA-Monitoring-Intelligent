<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant — Sentinel</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="assistant">

<div class="main">
  <div class="topbar">
    <h1>Assistant</h1>
  </div>

  <div class="content">
    <div class="card" style="height:100%;">
      <div class="chat-wrap">
        <div class="chat-log" id="chatLog"></div>
        <div class="suggestions">
          <div class="suggestion" data-q="Combien d'anomalies critiques récemment ?">Combien d'anomalies critiques récemment ?</div>
          <div class="suggestion" data-q="Quelle métrique cause le plus d'anomalies ?">Quelle métrique cause le plus d'anomalies ?</div>
          <div class="suggestion" data-q="Résume l'état général du système">Résume l'état général du système</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Posez une question à l'agent…">
          <button id="chatSend">Envoyer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
