<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiques — Sentinel</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body data-page="statistiques">

<div class="main">
  <div class="topbar">
    <h1>Statistiques globales</h1>
    <button id="refreshBtn" class="secondary">Rafraîchir</button>
  </div>

  <div class="content">
    <div class="status-msg" id="loadStatus"></div>

    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="card"><h3>Anomalies totales</h3><div class="stat-value" id="stat-total">—</div></div>
      <div class="card"><h3>Score moyen</h3><div class="stat-value" id="stat-score">—</div></div>
      <div class="card"><h3>Métrique la + touchée</h3><div class="stat-value" id="stat-metric" style="font-size:18px;">—</div></div>
      <div class="card"><h3>Sévérités distinctes</h3><div class="stat-value" id="stat-sevcount">—</div></div>
    </div>

    <div class="grid grid-2">
      <div class="card"><h3>Répartition par sévérité</h3><canvas id="chartSeverity"></canvas></div>
      <div class="card"><h3>Répartition par métrique impliquée</h3><canvas id="chartMetric"></canvas></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/statistiques.js"></script>
</body>
</html>
