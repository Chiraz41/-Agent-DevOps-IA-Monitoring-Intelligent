<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique — Sentinel</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="historique">

<div class="main">
  <div class="topbar">
    <h1>Historique des anomalies</h1>
    <button id="refreshBtn" class="secondary">Rafraîchir</button>
  </div>

  <div class="content">
    <div class="status-msg" id="loadStatus"></div>

    <div class="grid" style="grid-template-columns:auto auto 1fr auto; margin-bottom:16px; align-items:center;">
      <select id="filterSev">
        <option value="">Toutes sévérités</option>
        <option value="critical">Critique</option>
        <option value="warning">Avertissement</option>
        <option value="info">Info / autre</option>
      </select>
      <input type="number" id="limitInput" value="200" min="1" style="width:90px;" title="Nombre d'entrées à charger">
      <input type="text" id="searchInput" placeholder="Rechercher dans l'explication…">
      <span class="ts" id="countLabel"></span>
    </div>

    <div class="card">
      <table id="historyTable">
        <thead>
          <tr><th>Horodatage</th><th>Sévérité</th><th>Score</th><th>Métriques</th><th>Explication</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/historique.js"></script>
</body>
</html>
